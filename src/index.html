    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: dark light;
        --color-primary: #6366f1;
        --color-secondary: #8b5cf6;
        --color-bg: #0f0f13;
        --color-text: #e4e4e7;
        --color-text-muted: #a1a1aa;
        --color-border: #27272a;
        --color-card-bg: rgba(26, 26, 36, 0.6);
        --gradient-bg-1: rgba(99, 102, 241, 0.15);
        --gradient-bg-2: rgba(139, 92, 246, 0.08);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --color-primary: #4f46e5;
          --color-secondary: #7c3aed;
          --color-bg: #f8fafc;
          --color-text: #1e293b;
          --color-text-muted: #64748b;
          --color-border: #e2e8f0;
          --color-card-bg: rgba(255, 255, 255, 0.8);
          --gradient-bg-1: rgba(99, 102, 241, 0.08);
          --gradient-bg-2: rgba(139, 92, 246, 0.05);
        }
      }

      body {
        font-family: 'SUSE Mono', monospace, system-ui, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100vh;
        background: 
          radial-gradient(ellipse 80% 50% at 50% -20%, var(--gradient-bg-1), transparent),
          radial-gradient(ellipse 60% 40% at 80% 60%, var(--gradient-bg-2), transparent);
        pointer-events: none;
        z-index: -1;
      }

      /* Digital rain canvas container */
      .digital-rain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
        opacity: 0.5;
      }

      @media (prefers-color-scheme: light) {
        .digital-rain {
          opacity: 0.7;
        }
      }

      main {
        flex: 1;
        max-width: 1200px;
        margin: 0 auto;
        padding: 4rem 2rem;
        width: 100%;
      }

      .hero {
        text-align: center;
        padding: 4rem 0 6rem;
      }

      h1 {
        font-family: 'SUSE Mono', monospace;
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 400;
        line-height: 1.3;
        padding-bottom: 0.1em;
        margin-bottom: 1.5rem;
        background: linear-gradient(135deg, var(--color-text) 0%, var(--color-text-muted) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .hero-subtitle {
        font-size: 1.25rem;
        color: var(--color-text-muted);
        max-width: 600px;
        margin: 0 auto 3rem;
      }

      .cta-button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem 2rem;
        background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 20px -4px rgba(99, 102, 241, 0.5);
      }

      .cta-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px -4px rgba(99, 102, 241, 0.6);
      }

      .cta-button .github-icon {
        filter: brightness(0) invert(1);
      }

      footer {
        border-top: 1px solid var(--color-border);
        padding: 2rem;
        text-align: center;
        color: var(--color-text-muted);
        font-size: 0.875rem;
      }

      footer a {
        color: var(--color-primary);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      footer a:hover {
        color: var(--color-secondary);
      }

      @media (max-width: 768px) {
        main {
          padding: 2rem 1.5rem;
        }

        .hero {
          padding: 2rem 0 4rem;
        }
      }
    </style>
  </head>
  <body>
    <canvas class="digital-rain" id="digitalRain"></canvas>
    <main>
      <section class="hero">
        <h1>hglnd.se</h1>
        <p class="hero-subtitle">Personal projects and experiments.</p>
        <a href="https://github.com/crhaglun" class="cta-button" target="_blank" rel="noopener noreferrer">
          <img src="https://cdn.jsdelivr.net/npm/@primer/octicons@19/build/svg/mark-github-16.svg" alt="" width="20" height="20" loading="lazy" class="github-icon">
          GitHub profile
        </a>
      </section>
    </main>

    <footer>
      <p>© 2026 hglnd.se · Hosted on <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a></p>
    </footer>
    
    <script>
      // Pastel Digital Rain Effect
      document.addEventListener('DOMContentLoaded', function() {
        const canvas = document.getElementById('digitalRain');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        
        // Pastel colors - check color scheme for appropriate vibrancy
        const pastelColors = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? [
          'rgba(255, 120, 120, 0.9)',  // Stronger pastels for light mode
          'rgba(120, 255, 120, 0.9)',
          'rgba(120, 120, 255, 0.9)',
          'rgba(255, 255, 120, 0.9)',
          'rgba(255, 120, 255, 0.9)',
          'rgba(120, 255, 255, 0.9)'
        ] : [
          'rgba(255, 180, 180, 0.9)',  // Softer pastels for dark mode
          'rgba(180, 255, 180, 0.9)',
          'rgba(180, 180, 255, 0.9)',
          'rgba(255, 255, 180, 0.9)',
          'rgba(255, 180, 255, 0.9)',
          'rgba(180, 255, 255, 0.9)'
        ];
        

        

        
        function getRandomChar() {
          return '0123456789ABCDEF'[Math.floor(Math.random() * 16)];
        }
        
        // Full screen grid
        const cellSize = 20;
        let grid = [];
        let columns = 0;
        let rows = 0;
        
        function setupGrid() {
          grid = [];
          columns = Math.floor(canvas.width / cellSize);
          rows = Math.floor(canvas.height / cellSize);
          
          for (let x = 0; x < columns; x++) {
            grid[x] = [];
            for (let y = 0; y < rows; y++) {
              grid[x][y] = {
                char: '',
                alpha: 0,
                cooldown: 0, // Frames to wait before spawning new character
                color: '' // Color will be set when character is spawned
              };
            }
          }
        }
        
        window.addEventListener('resize', function() {
          resizeCanvas();
          setupGrid(); // Recreate grid on resize
        });
        resizeCanvas();
        setupGrid();
        
        function draw() {
          // Clear canvas
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          // Update and draw grid using cellular automata logic
          ctx.font = '12px "Sixtyfour", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          // First pass: update cell states based on rules
          // Process from bottom to top so cells see previous state of cell above
          for (let x = 0; x < columns; x++) {
            for (let y = rows - 1; y >= 0; y--) {
              const cell = grid[x][y];
              
              // Update cooldown for all cells
              if (cell.cooldown > 0) {
                cell.cooldown--;
              }
              
              // Top row: 0.3% chance to spawn new character with random color (more relaxed)
              // Only spawn if cooldown is 0
              if (y === 0) {
                if (cell.alpha === 0 && cell.cooldown === 0 && Math.random() < 0.003) {
                  cell.char = getRandomChar();
                  cell.alpha = 1;
                  cell.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                  cell.cooldown = 100; // Wait 2 frames before this cell can spawn again
                }
              }
              // Other rows: spawn if empty and cell above has character, inherit color
              // Only spawn if cooldown is 0
              else {
                const cellAbove = grid[x][y-1];
                if (cell.alpha === 0 && cellAbove.alpha > 0 && cellAbove.alpha < 0.95) {
                  cell.char = getRandomChar();
                  cell.alpha = 1;
                  cell.color = cellAbove.color; // Inherit color from above
                  cell.cooldown = 100; // Wait 2 frames before this cell can spawn again
                }
              }
              
              // Fade out all active characters very slowly (more relaxed)
              if (cell.alpha > 0) {
                cell.alpha -= 0.005;
                if (cell.alpha < 0) cell.alpha = 0;
              }
            }
          }
          
          // Second pass: draw all cells
          for (let x = 0; x < columns; x++) {
            for (let y = 0; y < rows; y++) {
              const cell = grid[x][y];
              
              if (cell.alpha > 0) {
                ctx.fillStyle = cell.color;
                ctx.globalAlpha = cell.alpha;
                ctx.fillText(cell.char, x * cellSize + cellSize/2, y * cellSize + cellSize/2);
              }
            }
          }
          
          ctx.globalAlpha = 1;
        }
        
        // Animation loop
        function animate() {
          draw();
          requestAnimationFrame(animate);
        }
        
        animate();
      });
    </script>
  </body>
</html>
